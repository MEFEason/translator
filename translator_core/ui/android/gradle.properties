org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official

# ⚠️ 不要在此硬编码 sdk.dir —— 那会让工程无法迁移到其他机器。
# 方式一（推荐）：设置环境变量 ANDROID_HOME / ANDROID_SDK_ROOT
# 方式二：local.properties（不入库），内容为 sdk.dir=C\:\\Users\\<你>\\AppData\\Local\\Android\\Sdk
# AGP 优先读 local.properties，其次读环境变量。

# 只构建 arm64：卓易通容器是 arm64，带其它 ABI 会显著增大包体
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

# 跳过不需要的检查，加快构建
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ⚠️ 工程路径含中文（代码开发），AGP 在 Windows 上会警告并可能失败。
# 见 http://b.android.com/95744 。已验证本工程可正常构建，故关闭检查。
# 若后续迁移到纯 ASCII 路径，可删除本行。
android.overridePathCheck=true
