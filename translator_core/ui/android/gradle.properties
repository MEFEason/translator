org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ⚠️ 2026-10-27 修复：Android Studio 导入工程时卡在
#    「Gradle: Downloading JDK list...」。
#
# 根因：工程声明 `sourceCompatibility/targetCompatibility = VERSION_17`，
# 而 AS 2026.2.1 内置 JBR 是 **Java 25** → Gradle 认为缺 JDK 17，
# 于是去 api.foojay.io 拉可用 JDK 清单做 toolchain 自动下载探测。
# 实测该接口在本机响应耗时 **18.5 秒**（services.gradle.org 只要 1.2s），
# 叠加 AS 与命令行两个 daemon 争抢 → 构建长时间无输出。
#
# 方案：本机已有 Java 25（AS 自带 JBR），javac 用 `--release 17`
# 完全可以编译出 Java 17 字节码，**根本不需要另装 JDK 17**。
# 关掉自动下载即可，Gradle 会直接用当前 daemon 的 JDK。
# 若将来真需要指定别的 JDK，用 org.gradle.java.home 显式指定路径。
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# ⚠️ 2026-10-27：显式把 Android Studio 自带的 JBR 加入 JDK 搜索路径。
#
# 为什么必须写这一行（实测，不是推测）：
#   `./gradlew -q javaToolchains` 显示 AS 自带的 JBR 被标记为
#   `Detected by: Current JVM` —— 即 Gradle **只在自己当前运行于该 JDK 时**
#   才能发现它。一旦 daemon 跑在别的 JDK（如 ~/.jdks/temurin-25.0.4.1），
#   JetBrains JDK 25 就从列表里消失。
#
#   而 IDE 传给 updateDaemonJvm 的 daemon JVM 条件恰恰是
#   `--jvm-version 25 --jvm-vendor jetbrains` →
#   「当前 JDK 不满足 + 本机找不到满足的 JetBrains 25」→ 想下载 →
#   没有 toolchain 下载仓库 → 任务失败。
#
# 显式指定路径后，无论 daemon 跑在哪个 JDK 上，
# 条件都能由本地 AS 自带的 JBR 满足，全程零下载。
#
# ⚠️ 路径写死是刻意的：这是**本机**的 AS 安装位置。
# 换机器时若 AS 装在别处，删掉这行即可（Gradle 会回退到自动探测）。
org.gradle.java.installations.paths=C\:\\Program Files\\Android\\Android Studio\\jbr

android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official

# ⚠️ 不要在此硬编码 sdk.dir —— 那会让工程无法迁移到其他机器。
# 方式一（推荐）：设置环境变量 ANDROID_HOME / ANDROID_SDK_ROOT
# 方式二：local.properties（不入库），内容为 sdk.dir=C\:\\Users\\<你>\\AppData\\Local\\Android\\Sdk
# AGP 优先读 local.properties，其次读环境变量。

# 只构建 arm64：卓易通容器是 arm64，带其它 ABI 会显著增大包体
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

# 跳过不需要的检查，加快构建
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ⚠️ 工程路径含中文（代码开发），AGP 在 Windows 上会警告并可能失败。
# 见 http://b.android.com/95744 。已验证本工程可正常构建，故关闭检查。
# 若后续迁移到纯 ASCII 路径，可删除本行。
android.overridePathCheck=true
